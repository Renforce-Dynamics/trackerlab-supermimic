name: CPU workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    env:
      MKL_THREADING_LAYER: SEQUENTIAL
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall -q source scripts tests
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: python -m pytest tests -v -ra
